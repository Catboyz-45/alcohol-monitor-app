name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # build เว็บแบบไม่มีค่าคอนฟิก (โหมดสาธิต) เพื่อตรวจว่า compile ผ่านทุกแพลตฟอร์มที่ใช้ MQTT ต่างกัน
      - run: flutter build web --release
